# Основной сервер: отвечает только при обращении по IP-адресу
# (regex для IPv4 в заголовке Host; порт nginx отбрасывает сам).
# localhost оставлен для проверок с самой машины — уберите, когда появится домен.
server {
    listen 80;
    server_name ~^\d+\.\d+\.\d+\.\d+$ localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}

# Обращения по любым другим именам (доменам) — закрыть соединение без ответа.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
